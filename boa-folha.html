<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boa Folha: Um Ano no RH</title>
<style>
:root{--roxo:#5b3fa0;--roxo2:#2b1f5c;--roxo3:#3a2470;--ceu:#7ec8e3;--ouro:#ffd166;--ouro2:#e09a2a;--verm:#e63946;--verde:#2fbf71;--piso:#f4c06a;--tinta:#1a1a2e;--papel:#fff8e8;--azul:#2a78c0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e0a1e;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:"Lucida Console","Courier New",Consolas,monospace;color:var(--tinta);user-select:none}
#stage{position:relative;flex-shrink:0;width:960px;height:540px;transform-origin:center center;background:var(--roxo2);overflow:hidden;box-shadow:0 0 0 4px var(--tinta),0 0 40px #000}
#tela{position:absolute;inset:0;width:960px;height:540px;image-rendering:pixelated;image-rendering:crisp-edges}
#ui,#fx{position:absolute;inset:0}
#fx{pointer-events:none;z-index:20}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30;transition:opacity .25s}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
/* caixas e botões */
.painel{position:absolute;background:var(--papel);border:4px solid var(--tinta);box-shadow:5px 5px 0 var(--ouro2),inset 0 0 0 2px #fff;padding:12px}
.painel.escuro{background:var(--roxo3);color:#fff;box-shadow:5px 5px 0 var(--tinta),inset 0 0 0 2px var(--roxo)}
.tit{font-size:20px;font-weight:bold;text-transform:uppercase;letter-spacing:2px;color:var(--ouro);text-shadow:2px 2px 0 var(--tinta),-1px -1px 0 var(--tinta),1px -1px 0 var(--tinta),-1px 1px 0 var(--tinta)}
.sub{font-size:12px;opacity:.8}
.btn{font:inherit;font-size:15px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;cursor:pointer;background:var(--piso);color:var(--tinta);border:3px solid var(--tinta);box-shadow:3px 3px 0 var(--ouro2),inset -2px -2px 0 rgba(0,0,0,.15),inset 2px 2px 0 rgba(255,255,255,.5);padding:8px 14px}
.btn:hover{background:var(--ouro)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ouro2)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.verde{background:var(--verde);color:#fff;text-shadow:1px 1px 0 var(--tinta)}
.btn.verm{background:var(--verm);color:#fff;text-shadow:1px 1px 0 var(--tinta)}
.btn.azul{background:var(--ceu)}
.btn.peq{font-size:11px;padding:4px 7px;box-shadow:2px 2px 0 var(--ouro2)}
.btn.grande{font-size:20px;padding:12px 22px}
.badge{display:inline-block;font-size:11px;font-weight:bold;padding:1px 5px;border:2px solid var(--tinta);color:#fff;text-shadow:1px 1px 0 var(--tinta);margin-right:3px}
.row{display:flex;gap:8px;align-items:center}
/* barra superior */
#barra{position:absolute;left:0;right:0;top:0;height:42px;background:var(--roxo);border-bottom:4px solid var(--ouro);display:flex;align-items:center;gap:16px;padding:0 150px 0 12px;color:#fff;font-size:13px;white-space:nowrap;z-index:5}
#barra b{color:var(--ouro)}
#barra .esp{flex:1}
.engr{position:absolute;right:10px;top:7px;z-index:40}
/* cartas */
.carta{position:relative;background:var(--papel);border:3px solid var(--tinta);box-shadow:3px 3px 0 var(--tinta);padding:7px;font-size:12px;line-height:1.3}
.carta .nome{font-size:15px;font-weight:bold}
.carta .desv{font-size:10px;color:#7a2a3a;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stat{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:bold}
.stat i{display:inline-block;width:6px;height:8px;background:#ccc;border:1px solid var(--tinta)}
.stat i.on{background:var(--verde)}
.stat.s i.on{background:var(--ceu)}
.stat.r i.on{background:var(--ouro2)}
.preco{font-weight:bold;color:var(--verde)}
.dinheiro-neg{color:var(--verm)}
/* combate */
#hpBox{position:absolute;left:250px;top:10px;width:440px;z-index:6;color:#fff;text-shadow:2px 2px 0 var(--tinta)}
#hpBox .nm{font-size:18px;font-weight:bold;color:var(--ouro);letter-spacing:1px}
#hpBox .tt{font-size:11px;opacity:.9}
.hp{position:relative;height:18px;border:3px solid var(--tinta);background:#3a0a14;margin-top:3px;box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.hp .back{position:absolute;inset:0;width:100%;background:#fff;transition:width .8s .35s}
.hp .front{position:absolute;inset:0;width:100%;background:linear-gradient(#ff7a7a,#e63946 50%,#a01828);transition:width .12s}
.hp .seg{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 43px,rgba(26,26,46,.5) 43px 44px)}
.hp .txt{position:absolute;right:6px;top:0;font-size:12px;line-height:12px;font-weight:bold}
#semanaBox{position:absolute;left:12px;top:10px;z-index:6;background:var(--tinta);color:var(--ouro);border:3px solid var(--ouro);padding:6px 10px;font-weight:bold;font-size:16px}
#unidades{position:absolute;left:0;right:0;bottom:0;height:150px;background:var(--roxo3);border-top:4px solid var(--ouro);display:flex;gap:8px;padding:10px;z-index:6}
.uni{width:178px;background:var(--papel);border:3px solid var(--tinta);padding:6px;font-size:11px;position:relative}
.uni.out{filter:grayscale(1);opacity:.6}
.uni .topo{display:flex;gap:6px}
.uni .nome{font-size:13px;font-weight:bold}
.pips{display:flex;gap:2px;margin:3px 0}
.pips i{width:12px;height:8px;border:2px solid var(--tinta);background:#fff}
.pips i.on{background:var(--verm)}
.ord{display:flex;gap:4px;margin-top:4px}
.ord button{flex:1;font:inherit;font-size:11px;font-weight:bold;cursor:pointer;border:2px solid var(--tinta);background:#ddd;padding:4px 2px}
.ord button.sel{background:var(--ouro);box-shadow:inset 0 0 0 2px var(--ouro2)}
.ord button[disabled]{opacity:.35;cursor:not-allowed}
.dica{font-size:10px;font-weight:bold;margin-top:3px}
.dica.f{color:#c05000}.dica.r{color:#7a7a90}
/* efeitos flutuantes */
.num{position:absolute;font-weight:bold;font-size:30px;color:#fff;text-shadow:3px 3px 0 var(--tinta),-2px -2px 0 var(--tinta),2px -2px 0 var(--tinta),-2px 2px 0 var(--tinta);white-space:nowrap;transform:translate(-50%,-50%);animation:pula 1.1s ease-out forwards}
.num.fraco{color:#ffb030;font-size:36px}.num.resiste{color:#a8a8c0;font-size:22px}.num.crit{color:#fff04a;font-size:44px}.num.cura{color:#7fe8a8}.num.est{color:#ff7a7a;font-size:18px}.num.info{font-size:15px;color:#e0e0f0}
.num small{display:block;font-size:13px;text-align:center}
@keyframes pula{0%{transform:translate(-50%,-30%) scale(.4);opacity:0}15%{transform:translate(-50%,-80%) scale(1.25);opacity:1}30%{transform:translate(-50%,-90%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-150%);opacity:0}}
.balao{position:absolute;max-width:240px;background:#fff;border:3px solid var(--tinta);padding:6px 9px;font-size:13px;font-weight:bold;line-height:1.25;box-shadow:3px 3px 0 rgba(0,0,0,.35);transform:translate(-20px,-100%);animation:surge .18s ease-out}
.balao:after{content:'';position:absolute;left:14px;bottom:-12px;border:6px solid transparent;border-top-color:var(--tinta)}
.balao.boss{background:#ffe1e1;border-color:#7a0a1a;font-size:14px}
.balao.boss:after{border-top-color:#7a0a1a}
.balao.obj{background:#e1f6ff;font-family:Consolas,monospace}
@keyframes surge{from{transform:translate(-20px,-80%) scale(.6);opacity:0}}
.banner{position:absolute;left:0;right:0;top:200px;text-align:center;font-size:52px;font-weight:bold;color:var(--ouro);letter-spacing:4px;text-shadow:4px 4px 0 var(--tinta),-3px -3px 0 var(--tinta),3px -3px 0 var(--tinta),-3px 3px 0 var(--tinta);animation:banner 1s ease-out forwards}
.banner small{display:block;font-size:20px;color:#fff;letter-spacing:2px}
@keyframes banner{0%{transform:scale(2.2);opacity:0}20%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.95)}}
/* quiz */
.alt{display:block;width:100%;text-align:left;font:inherit;font-size:14px;cursor:pointer;background:#fff;border:3px solid var(--tinta);padding:8px 10px;margin:6px 0;box-shadow:3px 3px 0 var(--ouro2)}
.alt:hover{background:#fff4c8}
.alt.certa{background:#9af0b8}.alt.errada{background:#ffa8a8}
.timer{height:10px;border:2px solid var(--tinta);background:#eee}.timer i{display:block;height:100%;background:var(--verde);transition:width .2s linear}
/* entrevista */
.lower{position:absolute;left:300px;top:330px;background:var(--verm);color:#fff;border:3px solid var(--tinta);padding:6px 14px;font-weight:bold;font-size:20px;box-shadow:4px 4px 0 var(--tinta)}
.lower small{display:block;font-size:12px;font-weight:normal}
.fala{position:absolute;left:300px;top:390px;width:600px;min-height:80px;background:var(--papel);border:4px solid var(--tinta);padding:12px 16px;font-size:17px;line-height:1.4;box-shadow:5px 5px 0 var(--ouro2)}
.rec{position:absolute;left:18px;top:16px;color:#ff4040;font-weight:bold;font-size:16px;z-index:7;text-shadow:2px 2px 0 #000}
.rec:before{content:'';display:inline-block;width:12px;height:12px;border-radius:50%;background:#ff2020;margin-right:6px;animation:pisca 1s steps(2) infinite}
@keyframes pisca{50%{opacity:0}}
.bilhete{position:absolute;left:280px;top:90px;width:400px;background:#a8d8ff;border:4px solid var(--tinta);padding:20px;transform:rotate(-3deg);box-shadow:8px 8px 0 rgba(0,0,0,.5);font-size:15px;line-height:1.5}
.modal{position:absolute;inset:0;background:rgba(14,10,30,.72);z-index:50;display:flex;align-items:center;justify-content:center}
.lista-time{display:flex;flex-direction:column;gap:5px}
.linha{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--tinta);padding:4px 6px;font-size:12px}
.linha.sel{background:#fff4c8;box-shadow:inset 0 0 0 2px var(--ouro2)}
.linha.bloq{opacity:.5}
.num-ord{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;background:var(--tinta);color:var(--ouro);font-weight:bold}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--roxo)}
.alt:disabled{color:var(--tinta);cursor:default}
/* cena de VS (estilo jogo de luta) */
.vs{position:absolute;inset:0;z-index:45;overflow:hidden;background:#07040f;cursor:pointer}
.vs.treme{animation:vsTreme .45s linear}
.vs.sai{animation:vsSai .35s ease-in forwards}
.vs .lado{position:absolute;top:0;bottom:0;width:60%;overflow:hidden}
.vs .esq{left:0;clip-path:polygon(0 0,100% 0,80% 100%,0 100%);background:linear-gradient(160deg,#0e1f5a,#1a4a9a 45%,#2a78c0);animation:vsEntraE .35s cubic-bezier(.2,.9,.3,1.2) both}
.vs .dir{right:0;clip-path:polygon(20% 0,100% 0,100% 100%,0 100%);background:linear-gradient(200deg,#4a0610,#a01020 45%,#e63946);animation:vsEntraD .35s cubic-bezier(.2,.9,.3,1.2) both}
.vs .lado:before{content:'';position:absolute;inset:-40px;background:repeating-linear-gradient(98deg,transparent 0 26px,rgba(255,255,255,.10) 26px 30px,transparent 30px 60px,rgba(255,255,255,.05) 60px 62px);animation:vsLinhas .35s linear infinite}
.vs .dir:before{animation-direction:reverse}
.vs .lado:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,rgba(255,255,255,.18),transparent 60%)}
.vs .corte{position:absolute;left:50%;top:-20px;width:10px;height:600px;background:#fff;transform:translateX(-50%) rotate(11deg);box-shadow:0 0 18px #fff,0 0 40px #ffd166;animation:vsCorte .5s .25s both}
.vs .vtit{position:absolute;top:14px;font-size:15px;font-weight:bold;letter-spacing:3px;color:#fff;text-shadow:2px 2px 0 #000;animation:vsSobe .3s .35s both}
.vs .vtit.e{left:24px}.vs .vtit.d{right:24px}
.vs .time{position:absolute;left:28px;top:52px;display:grid;grid-template-columns:repeat(2,148px);gap:14px 18px}
.vs .vcard{background:#fff;border:4px solid #1a1a2e;box-shadow:6px 6px 0 rgba(0,0,0,.55);transform:skewX(-7deg);animation:vsCarta .32s cubic-bezier(.2,.9,.3,1.3) both}
.vs .vcard canvas{display:block;transform:skewX(7deg)}
.vs .vcard .nm{background:#1a1a2e;color:#ffd166;text-align:center;font-size:13px;font-weight:bold;letter-spacing:1px;padding:2px 0}
.vs .vcard .ar{position:absolute;right:-6px;top:-8px;transform:skewX(7deg)}
.vs .chefe{position:absolute;right:26px;bottom:6px;animation:vsChefe .55s .45s cubic-bezier(.2,.9,.3,1.15) both}
.vs .chefe canvas{animation:vsFlutua 1.6s ease-in-out infinite}
.vs .aura{position:absolute;left:50%;bottom:10px;width:330px;height:60px;transform:translateX(-50%);border-radius:50%;filter:blur(2px);animation:vsAura 1s ease-in-out infinite alternate}
.vs .placa{position:absolute;right:20px;top:44px;text-align:right;color:#fff;font-weight:bold;font-size:30px;letter-spacing:2px;text-shadow:3px 3px 0 #000,-2px -2px 0 #000;animation:vsSobe .3s .6s both}
.vs .placa small{display:block;font-size:13px;letter-spacing:1px;color:#ffd166}
.vs .vstxt{position:absolute;left:50%;top:48%;font-size:170px;font-weight:900;font-style:italic;letter-spacing:-8px;color:#ffd166;transform:translate(-50%,-50%);text-shadow:6px 6px 0 #e63946,12px 12px 0 #1a1a2e,-3px -3px 0 #1a1a2e,3px -3px 0 #1a1a2e,-3px 3px 0 #1a1a2e;animation:vsSlam .4s 1.1s cubic-bezier(.2,1.6,.4,1) both}
.vs .fight{position:absolute;left:0;right:0;top:50%;text-align:center;font-size:120px;font-weight:900;font-style:italic;color:#fff;letter-spacing:6px;transform:translateY(-50%);text-shadow:5px 5px 0 #e63946,10px 10px 0 #1a1a2e,-3px -3px 0 #1a1a2e;opacity:0;animation:vsFight .9s 2.35s both}
.vs .faixa{position:absolute;left:0;right:0;top:50%;height:150px;transform:translateY(-50%);background:rgba(10,6,24,.75);opacity:0;animation:vsFaixa .9s 2.3s both}
.vs .pular{position:absolute;right:12px;bottom:8px;color:#fff;font-size:11px;opacity:.6}
@keyframes vsEntraE{from{transform:translateX(-100%)}}
@keyframes vsEntraD{from{transform:translateX(100%)}}
@keyframes vsLinhas{to{transform:translateX(60px)}}
@keyframes vsCorte{from{height:0;opacity:0}}
@keyframes vsSobe{from{transform:translateY(-30px);opacity:0}}
@keyframes vsCarta{from{transform:skewX(-7deg) translateX(-260px);opacity:0}}
@keyframes vsChefe{from{transform:translateX(420px) scale(1.25);opacity:0}}
@keyframes vsFlutua{50%{transform:translateY(-8px)}}
@keyframes vsAura{from{opacity:.45;transform:translateX(-50%) scale(.9)}to{opacity:.9;transform:translateX(-50%) scale(1.1)}}
@keyframes vsSlam{from{transform:translate(-50%,-50%) scale(5) rotate(-12deg);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes vsFight{0%{opacity:0;transform:translateY(-50%) scale(3)}18%{opacity:1;transform:translateY(-50%) scale(.92)}28%{transform:translateY(-50%) scale(1.05)}85%{opacity:1}100%{opacity:1;transform:translateY(-50%) scale(1)}}
@keyframes vsFaixa{from{opacity:0}20%{opacity:1}to{opacity:1}}
@keyframes vsTreme{0%,100%{transform:translate(0,0)}20%{transform:translate(-14px,8px)}40%{transform:translate(12px,-10px)}60%{transform:translate(-8px,6px)}80%{transform:translate(6px,-4px)}}
@keyframes vsSai{to{opacity:0;transform:scale(1.15)}}
/* janelinha de vídeo de quem está em casa */
.video{position:absolute;width:212px;background:#1a1a2e;border:3px solid #1a1a2e;box-shadow:4px 4px 0 rgba(0,0,0,.45);z-index:4;animation:surgeVideo .3s ease-out}
.video canvas{display:block;width:206px;height:129px;border-top:2px solid #3a3a50}
.video .vbar{display:flex;align-items:center;gap:5px;font-size:10px;color:#fff;padding:2px 4px;background:#2a2f45}
.video .vx{margin-left:auto;cursor:pointer;opacity:.7}.video .vx:hover{opacity:1}
.video .rec-dot{width:7px;height:7px;border-radius:50%;background:#ff3030;animation:pisca 1s steps(2) infinite}
.video .vleg{background:var(--papel);font-size:10px;line-height:1.3;padding:4px 5px;color:var(--tinta)}
.video .vleg span{color:#555}
@keyframes surgeVideo{from{transform:scale(.6);opacity:0}}

</style>

<body>
<!--
  BOA FOLHA: UM ANO NO RH
  Jogo de gestão com combate por turnos. Arquivo único, 100% offline.
  Módulos: Áudio (Som) · Regras (dados, combate e economia) · Perguntas · Render (Arte, Cena)
           Estado · Mercado · Treino · Eventos · Combate (animação) · UI
-->
<div id="stage">
  <canvas id="tela" width="320" height="180"></canvas>
  <div id="ui"></div>
  <div id="fx"></div>
  <div id="flash"></div>
</div>
<script>
/* =========================================================================
   MÓDULO ÁUDIO — tudo sintetizado em tempo real (Web Audio), sem voz real
   API pública: Som.music(id) Som.stopMusic() Som.setWeek(n) Som.sfx(id)
                Som.say(texto, 'char'|'boss'|'obj:tipo', atraso, opções) → duração
                Som.onSay(fn) (para o balão) Som.ambient(bool) Som.setVol(bus, v) Som.setMuted(bool)
   ========================================================================= */
const Som = (() => {
  let ctx = null, master, comp, noiseBuf, echoIn, ambBus;
  const buses = {};
  const vol = { music: 0.55, sfx: 0.8, voice: 0.9 };
  let muted = false;
  const R = Math.random;

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ctx.destination);
    for (const k of ['music', 'sfx', 'voice']) { buses[k] = ctx.createGain(); buses[k].connect(master); }
    const len = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = R() * 2 - 1;
    // eco para "Na Ferida"
    echoIn = ctx.createGain();
    const dl = ctx.createDelay(1), fb = ctx.createGain(), wet = ctx.createGain();
    dl.delayTime.value = 0.26; fb.gain.value = 0.38; wet.gain.value = 0.5;
    echoIn.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(buses.sfx);
    // ambiente: abafado e distante
    ambBus = ctx.createGain(); ambBus.gain.value = 0.5;
    const amLp = ctx.createBiquadFilter(); amLp.type = 'lowpass'; amLp.frequency.value = 2200;
    ambBus.connect(amLp); amLp.connect(buses.sfx);
    applyVol();
    return ctx;
  }
  function applyVol() {
    if (!ctx) return;
    master.gain.value = muted ? 0 : 0.9;
    for (const k in buses) buses[k].gain.value = vol[k];
  }
  const now = () => ctx.currentTime;
  const out = b => buses[b || 'sfx'];

  /* ---------- primitivas ---------- */
  function nf(n) {
    const m = /^([A-G])(#|b)?(-?\d)$/.exec(n);
    if (!m) return 0;
    const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    return 440 * Math.pow(2, ((+m[3] + 1) * 12 + base - 69) / 12);
  }
  function gainEnv(t, dur, v, a, hold) {
    const g = ctx.createGain();
    a = Math.min(a, dur * 0.5);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + a);
    if (hold) { g.gain.setValueAtTime(v, t + Math.max(a, dur * 0.75)); g.gain.linearRampToValueAtTime(0, t + dur); }
    else g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, a + 0.01));
    return g;
  }
  function bq(type, f, q) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q || 1; return b; }
  const PW = {};
  function pulse(dt) {
    if (PW[dt]) return PW[dt];
    const n = 32, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) re[k] = 2 * Math.sin(Math.PI * k * dt) / (Math.PI * k);
    return (PW[dt] = ctx.createPeriodicWave(re, im));
  }
  function tone({ f = 440, type = 'square', t = now(), dur = 0.2, v = 0.3, a = 0.005, to = null, bus, dest, detune = 0, vib = 0, vibRate = 6, filter = null, hold = false }) {
    const o = ctx.createOscillator();
    if (type === 'pulse25') o.setPeriodicWave(pulse(0.25));
    else if (type === 'pulse12') o.setPeriodicWave(pulse(0.125));
    else o.type = type;
    o.frequency.setValueAtTime(Math.max(f, 1), t);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(to, 1), t + dur);

    }

  let ambOn = false, ambTimer = null, bed = null;
  function ambient(on) {
    if (!init() || on === ambOn) return;

    if (on) {
      bed = noiseSrc(now(), 3600);

    else say('QUEM PEGOU MEU GRAMPEADOR?', 'char', 0, { pitch: 0.9, v: 0.6 });

  };

      espDesc: 'Papel atolado: cada ação tem 20% de chance de falhar.', entrada: 'Ciano vazio. Papel atolado.', vence: 'Imprimindo 400 páginas em branco...', perde: 'Toner... recarregado...' },
    { id: 'ceo', nome: 'O CEO', titulo: 'Chefe Final do Board', tipo: 'boss', hp: 290, fraco: [], resiste: [], pressao: [3, 2], esp: 'board',

  // Chefe surpresa: substitui o chefe da fase por 1 semana (4,5% por semana, no máximo 1x por mês)
  const FILHO = { id: 'filho', nome: 'Enzo', titulo: 'O Filho do Dono · CEO da própria startup (0 clientes)', tipo: 'boss', fraco: ['JUR', 'OPE'], resiste: ['VEN', 'TEC'], esp: 'filho',

  const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

  const EVENTOS = [
    { id: 'feriado', nome: 'Feriado prolongado', desc: 'SEXTOU! O prazo do combate cai para 3 semanas, mas o chefe também emendou e chega com 20% menos vida.' },

  const EVENTO = Object.fromEntries(EVENTOS.map(e => [e.id, e]));
  // Ausências: quem está ausente não pode ser escalado no mês
  const AUSENCIAS = {
    atestado: { nome: 'De atestado', motivo: 'gripe forte', desc: 'Febre de 39º. Volta no mês que vem.' },
    homeoffice: { nome: 'Home office', motivo: 'a VPN caiu', desc: 'Tá trabalhando... em tese. A internet não colabora.' },

  };
  const ausencia = (st, id) => { const a = (st.ausencias || []).find(x => x.id === id); return a ? a.tipo : null; };

  /* ---------- utilidades ---------- */
  const d6 = rng => 1 + Math.floor(rng() * 6);
  const pick = (arr, rng) => arr[Math.floor(rng() * arr.length)];
  function shuffle(a, rng) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function membro(id) { const c = CHAR[id]; return { id, H: c.H, S: c.S, R: c.R, meses: 0 }; }
  function salarioDe(m) { const c = CHAR[m.id]; return c.id === 'gloria' ? Math.round(c.salario * 1.5) : c.salario; }
  function folha(st) { return st.time.reduce((s, m) => s + salarioDe(m), 0); }
  function custoContratar(st, id) { const c = CHAR[id].custo; return st.evento === 'promocao' ? Math.ceil(c / 2) : c; }
  function boss(st) { return BOSSES[st.mes]; }

  /* ---------- ciclo do ano ---------- */
  function novoJogo() {
    return { v: 1, mes: 0, caixa: CFG.caixaInicial, derrotas: 0, vitorias: 0, pt: 0, time: CFG.timeInicial.map(membro),
      evento: null, ausencias: [], mercado: [], cursos: 0, mentoria: false, mentor: null, treinoFeito: false, escalacao: [], fase: 'inicioMes', fim: null, historico: [] };
  }
  // Prepara o mês: evento + mercado. Retorna o evento (ou null).
  function iniciarMes(st, rng = Math.random) {
    st.evento = null; st.ausencias = []; st.cursos = 0; st.mentoria = false; st.mentor = null; st.treinoFeito = false;
    if (st.mes > 0) {
      const ev = pick(EVENTOS, rng); st.evento = ev.id;
      if (ev.id === 'corte') st.caixa -= 6;
      if (ev.id === 'elogio') st.caixa += 8;
      if (ev.id === 'verba') st.pt += 3;
      if (ev.id === 'gripe' && st.time.length > 1) st.ausencias.push({ id: pick(st.time, rng).id, tipo: 'atestado' });
      const livres = st.time.filter(m => !ausencia(st, m.id));
      if (st.time.length >= CFG.minTimeAusencia && livres.length > 3 && rng() < CFG.chanceAusencia)
        st.ausencias.push({ id: pick(livres, rng).id, tipo: pick(['homeoffice', 'licenca', 'ferias', 'aniversario'], rng) });
    }
    const livres = CHARS.filter(c => !st.time.some(m => m.id === c.id)).map(c => c.id);
    st.mercado = shuffle(livres, rng).slice(0, CFG.ofertasMercado);

    st.fase = 'hub';
    return st.evento ? EVENTO[st.evento] : null;
  }
  function podeContratar(st, id) {
    if (st.time.length >= CFG.maxTime) return 'Time cheio (máximo ' + CFG.maxTime + ').';
    if (!st.mercado.includes(id)) return 'Candidato indisponível.';
    if (st.caixa < custoContratar(st, id)) return 'Dinheiro insuficiente.';
    return null;
  }
  function contratar(st, id) {
    const erro = podeContratar(st, id); if (erro) return erro;
    st.caixa -= custoContratar(st, id);
    st.time.push(membro(id));
    st.mercado = st.mercado.filter(x => x !== id);
    if (st.escalacao.length < CFG.maxCampo) st.escalacao.push(id);
    return null;
  }
  function demitir(st, id) {
    if (st.time.length <= 1) return 'Não dá para ficar sem ninguém.';

    st.escalacao = st.escalacao.filter(x => x !== id);
    if (st.mentor === id) st.mentor = null;

  }
  function resultadoTreino(st, acertos) {
    st.treinoFeito = true;
    st.pt += acertos + (acertos === 5 ? 2 : 0);
    st.mentoria = acertos >= 4 && st.time.some(m => CHAR[m.id].nivel === 'S');
    return { pt: acertos + (acertos === 5 ? 2 : 0), mentoria: st.mentoria };
  }
  // Curso pago: troca dinheiro por Pontos de Treino (limite por mês)
  function comprarCurso(st) {
    if (st.cursos >= CFG.maxCursosMes) return 'Limite de cursos do mês atingido.';
    if (st.caixa < CFG.precoCurso) return 'Dinheiro insuficiente.';
    st.caixa -= CFG.precoCurso; st.cursos++; st.pt += 1; return null;
  }
  function treinar(st, id, stat) {
    const m = st.time.find(x => x.id === id); if (!m) return 'Não está no time.';
    const custo = CFG.custoTreino[stat];
    if (st.pt < custo) return 'Pontos de Treino insuficientes.';
    if (m[stat] >= CFG.tetos[stat]) return 'Já está no máximo.';
    st.pt -= custo; m[stat]++; return null;
  }
  function escalar(st, ids) {
    const v = ids.filter((id, i) => ids.indexOf(id) === i && st.time.some(m => m.id === id) && !ausencia(st, id)).slice(0, CFG.maxCampo);
    st.escalacao = v; return v;
  }

  /* ---------- COMBATE ---------- */
  function iniciarCombate(st, rng = Math.random) {
    const b = boss(st);
    let hp = Math.round(b.hp * CFG.hpEscala * (st.evento === 'feriado' ? 0.8 : 1));
    const bonusR = st.evento === 'cafe' ? 1 : 0;
    const time = st.escalacao.map(id => {
      const m = st.time.find(x => x.id === id);
      return { id, H: m.H, S: m.S, R: m.R + bonusR, estresse: 0, out: false, dadoBonus: 0, dadoMin: 0, danoX: 1 };
    });
    const ordenar = arr => arr.filter(u => u.id !== 'anamaria').concat(arr.filter(u => u.id === 'anamaria'));
    return { bossId: b.id, hp, hpMax: hp, semana: 0, prazo: st.evento === 'feriado' ? 3 : CFG.semanas,
      time: ordenar(time), mentor: st.mentoria ? st.mentor : null, fraco: b.fraco.slice(), resiste: b.resiste.slice(),
      pressaoExtra: 0, travada: null, fim: null, totalDano: 0 };
  }
  function multArea(cb, area) { return cb.fraco.includes(area) ? 'fraco' : cb.resiste.includes(area) ? 'resiste' : 'neutro'; }

  // Resolve uma semana. ordens: {id: 'hard'|'soft'}. Retorna lista de eventos para a animação.
  function semana(cb, ordens, rng = Math.random) {
    const ev = [];
    if (cb.fim) return ev;
    cb.semana++;
    const pai = BOSSES.find(x => x.id === cb.bossId);
    const filho = !cb.filhoVeio && rng() < CFG.chanceFilho;
    const b = filho ? { ...FILHO, pressao: [99, pai.pressao[1]] } : pai;
    let guarda = null;
    if (filho) { cb.filhoVeio = true; cb.filhoAgora = true; guarda = { fraco: cb.fraco, resiste: cb.resiste }; cb.fraco = FILHO.fraco.slice(); cb.resiste = FILHO.resiste.slice(); }
    const fimDoFilho = () => { if (!filho) return; cb.fraco = guarda.fraco; cb.resiste = guarda.resiste; cb.filhoAgora = false; ev.push({ t: 'filho', sai: true, fraco: cb.fraco, resiste: cb.resiste }); };
    cb.travada = null;
    // efeitos de início de semana
    if (b.esp === 'trava') { cb.travada = pick(Object.keys(AREAS), rng); ev.push({ t: 'especial', texto: 'TRAVOU! A área ' + cb.travada + ' não causa dano nesta semana.' }); }
    if (b.esp === 'board') {
      const areas = Object.keys(AREAS).filter(a => !cb.fraco.includes(a));
      if (cb.fraco.length) cb.resiste = cb.fraco.slice();
      cb.fraco = [pick(areas, rng)];
      ev.push({ t: 'especial', texto: 'Nova pauta do Board: agora o CEO é fraco contra ' + cb.fraco[0] + (cb.resiste.length ? ' e resiste a ' + cb.resiste[0] : '') + '.' });
    }
    ev.push({ t: 'semana', n: cb.semana, prazo: cb.prazo });
    if (filho) {
      ev.push({ t: 'filho', entra: true, fraco: cb.fraco, resiste: cb.resiste });
      const alvo = pick(cb.time.filter(u => !u.out), rng);
      if (alvo) { alvo.postado = true; ev.push({ t: 'especial', texto: 'Post no LinkedIn! ' + CHAR[alvo.id].nome + ' vai passar a semana gravando vídeo pro Enzo.', who: alvo.id }); }
    }
    const ativos = cb.time.filter(u => !u.out);
    let fila = ativos.slice();
    let mentoriaUsada = false, acertosFraco = 0, penalProx = null, metadeProx = false, pularProx = false;
    for (let i = 0; i < fila.length; i++) {
      const u = fila[i];
      if (u.out || cb.fim) continue;
      const c = CHAR[u.id];
      let tipo = ordens[u.id] === 'soft' ? 'soft' : 'hard';
      let area = c.area;
      const meu = { metade: false };
      if (u.postado) { u.postado = false; ev.push({ t: 'perde', who: u.id, motivo: 'linkedin' }); continue; }
      if (pularProx) { pularProx = false; ev.push({ t: 'perde', who: u.id, motivo: 'reuniao' }); continue; }
      if (penalProx === 'dado') { u.dadoBonus -= 1; penalProx = null; }
      if (metadeProx) { meu.metade = true; metadeProx = false; }
      // desvantagens que impedem a ação
      const desv = (texto) => ev.push({ t: 'desv', who: u.id, texto: texto || c.fala });
      if (u.id === 'anamaria' && cb.semana === 1) { desv(); ev.push({ t: 'perde', who: u.id, motivo: 'lento' }); continue; }
      if (u.id === 'junior' && cb.semana === cb.prazo && rng() < 0.5) { desv(); ev.push({ t: 'perde', who: u.id, motivo: 'esqueceu' }); continue; }
      if (u.id === 'gugu' && rng() < 0.3) { desv(); ev.push({ t: 'perde', who: u.id, motivo: 'reuniao' }); continue; }
      if (u.id === 'roberto' && rng() < 0.15) { desv(); ev.push({ t: 'perde', who: u.id, motivo: 'folga' }); continue; }
      if (u.id === 'tata' && rng() < 0.3) { desv(); u.dadoBonus += 2; ev.push({ t: 'perde', who: u.id, motivo: 'analise' }); continue; }
      if (u.id === 'sandy' && rng() < 0.3) { desv(); u.danoX = 2; ev.push({ t: 'perde', who: u.id, motivo: 'escrito' }); continue; }
      if (u.id === 'marilia' && rng() < 0.3) { desv(); u.dadoMin = 4; ev.push({ t: 'perde', who: u.id, motivo: 'refaz' }); continue; }
      if (u.id === 'fatima' && rng() < 0.25 && i + 1 < fila.length) {
        desv(); const prox = fila[i + 1];
        u.estresse = Math.max(0, u.estresse - 1); prox.estresse = Math.max(0, prox.estresse - 1);
        pularProx = true; ev.push({ t: 'perde', who: u.id, motivo: 'reuniao', junto: prox.id }); continue;
      }
      if (b.esp === 'digital' && i === 0 && rng() < 0.35) { ev.push({ t: 'especial', texto: 'Digital recusada! ' + c.nome + ' não conseguiu entrar.', who: u.id }); ev.push({ t: 'perde', who: u.id, motivo: 'digital' }); continue; }
      // desvantagens que alteram a ação
      if (u.id === 'pedro' && tipo === 'soft') { desv(); tipo = 'hard'; }
      if (u.id === 'felipe' && rng() < 0.3) { desv(); tipo = tipo === 'hard' ? 'soft' : 'hard'; }
      if (u.id === 'gil' && tipo === 'hard' && rng() < 0.3) { area = pick(Object.keys(AREAS), rng); desv('ah, oi? ' + area + '?'); }
      let aposta = false;
      if (u.id === 'luciano' && tipo === 'hard' && rng() < 0.3) { desv(); aposta = true; }
      if (u.id === 'carlinhos' && rng() < 0.3) { desv(); meu.metade = true; }
      // dado
      let dado = d6(rng);
      if (u.dadoMin) { dado = Math.max(dado, u.dadoMin); u.dadoMin = 0; }
      if (u.dadoBonus) { dado = Math.max(1, Math.min(6, dado + u.dadoBonus)); u.dadoBonus = 0; }
      let dicaMentor = false;
      if (dado === 1 && cb.mentor && !mentoriaUsada && CHAR[u.id].nivel !== 'S' && cb.time.some(x => x.id === cb.mentor && !x.out)) {
        mentoriaUsada = true; dicaMentor = true; dado = d6(rng);
        ev.push({ t: 'mentoria', mentor: cb.mentor, who: u.id });

      if (b.esp === 'atola' && rng() < 0.2) { falha = true; ev.push({ t: 'especial', texto: 'PAPEL ATOLADO! A ação de ' + c.nome + ' falhou.', who: u.id }); }
      if (u.id === 'luan' && !falha && rng() < 0.3) { desv(); falha = true; }
      if (tipo === 'hard') {
        mult = multArea(cb, area);
        const tm = mult === 'fraco' ? CFG.multFraco : mult === 'resiste' ? CFG.multResiste : 1;
        dano = u.H * CFG.hardBase * CFG.dadoMul[dado - 1] * tm * (dicaMentor ? 1.25 : 1);
        if (cb.travada === area) { dano = 0; mult = 'travada'; }
      } else {
        dano = (u.S * CFG.softBase + CFG.softFixo) * CFG.dadoMul[dado - 1];

        if (b.esp === 'caneta') dano *= 0.5;
      }
      if (aposta) { if (dado >= 4) dano *= 1.5; else { dano = 0; u.estresse++; } }
      if (meu.metade) dano *= 0.5;
      if (u.danoX !== 1) { dano *= u.danoX; u.danoX = 1; }
      if (b.esp === 'recurso' && cb.semana === cb.prazo) dano *= 0.75;
      if (filho) dano /= CFG.forcaFilho;
      if (falha) dano = 0;
      dano = Math.round(dano);
      // cura de estresse do Soft
      let cura = null;
      if (tipo === 'soft' && dado > 1 && !falha && u.id !== 'caetano' && b.esp !== 'consenso') {
        const alvo = cb.time.filter(x => !x.out && x.estresse > 0).sort((a, z) => z.estresse - a.estresse)[0];
        if (alvo) { const q = u.id === 'hebe' ? 2 : 1; alvo.estresse = Math.max(0, alvo.estresse - q); cura = { who: alvo.id, q }; }
      }
      cb.hp = Math.max(0, cb.hp - dano); cb.totalDano += dano;
      if (tipo === 'hard' && mult === 'fraco' && dano > 0) acertosFraco++;
      ev.push({ t: 'acao', who: u.id, tipo, area, dado, dano, mult, crit: dado === 6 && dano > 0, ruim: dado === 1, cura, hp: cb.hp });
      // efeitos pós-ação
      if (b.esp === 'anota' && dado === 1) { u.estresse += 2; ev.push({ t: 'especial', texto: 'O Auditor anotou o deslize de ' + c.nome + '. +2 de estresse.', who: u.id }); }
      if (u.id === 'roberto') u.estresse++;
      if (u.id === 'hebe' && rng() < 0.25) {
        const outros = cb.time.filter(x => !x.out && x.id !== u.id);
        if (outros.length) { const alvo = pick(outros, rng); alvo.estresse++; desv(); ev.push({ t: 'estresse', who: alvo.id, q: 1, de: 'fofoca' }); }
      }
      if (u.id === 'ivete' && rng() < 0.3) { desv(); metadeProx = true; }
      if (u.id === 'angelica' && rng() < 0.3) { desv(); penalProx = 'dado'; }
      if (u.id === 'fausto' && rng() < 0.3 && i + 1 < fila.length) {
        desv(); u.estresse++;
        const prox = fila[i + 1]; ev.push({ t: 'perde', who: prox.id, motivo: 'centralizador' });
        fila[i + 1] = u;   // Fausto age no lugar do próximo
      }
      checaOut(cb, ev);
      if (cb.hp <= 0) { cb.fim = { vitoria: true, semana: cb.semana }; break; }
    }
    if (!cb.fim && acertosFraco >= CFG.sinergiaMin) {
      const bonus = Math.round(cb.time.filter(x => !x.out).reduce((s, x) => s + x.S, 0) * 2);
      cb.hp = Math.max(0, cb.hp - bonus); cb.totalDano += bonus;

    }
    if (cb.fim) { cb.filhoAgora = false; ev.push({ t: 'fim', vitoria: true, semana: cb.semana, cedo: cb.prazo - cb.semana, filho }); return ev; }
    // turno do chefe
    const cura = b.esp === 'filho' ? CFG.curaFilho : b.esp === 'meta' && cb.semana === 3 ? 0.15 : b.esp === 'malha' && cb.semana === 2 ? 0.2 : b.esp === 'virus' ? 0.08 : b.esp === 'board' && cb.semana === 2 ? 0.1 : 0;
    if (cura && cb.semana < cb.prazo) { const q = Math.round(cb.hpMax * cura); cb.hp = Math.min(cb.hpMax, cb.hp + q); ev.push({ t: 'cura', q, hp: cb.hp, filho }); }
    if (b.esp === 'gerente') cb.pressaoExtra++;
    const [alvos, val] = b.pressao;
    const vivos = shuffle(cb.time.filter(x => !x.out), rng).slice(0, alvos + (b.esp === 'gerente' ? Math.floor(cb.pressaoExtra / 2) : 0));
    const golpes = vivos.map(x => { const q = val + (b.esp === 'gerente' && cb.pressaoExtra % 2 === 0 ? 1 : 0); x.estresse += q; return { who: x.id, q }; });
    ev.push({ t: 'chefe', golpes, filho });
    checaOut(cb, ev);

    if (cb.semana >= cb.prazo || cb.time.every(x => x.out)) {
      cb.fim = { vitoria: false, semana: cb.semana };
      ev.push({ t: 'fim', vitoria: false, semana: cb.semana, motivo: cb.time.every(x => x.out) ? 'todos' : 'prazo' });

  }
  function checaOut(cb, ev) {
    for (const x of cb.time) if (!x.out && x.estresse >= x.R) { x.out = true; ev.push({ t: 'out', who: x.id }); }
  }

  /* ---------- fim do mês ---------- */
  function fimMes(st, cb, rng = Math.random) {
    const rel = { mes: st.mes, vitoria: !!(cb && cb.fim && cb.fim.vitoria), receita: 0, salarios: 0, demissoes: [], cedo: 0 };
    if (rel.vitoria) {
      rel.cedo = Math.max(0, cb.prazo - cb.fim.semana);

tado por norma interna ou negociação coletiva, sem homologação","Composto por pelo menos 10 níveis salariais"],"c":2,"e":"Art. 461, §2º, CLT: quadro de carreira ou plano de cargos por norma interna ou negociação coletiva dispensa homologação ou registro."},{"q":"Para a equiparação salarial pós-2017, a diferença de tempo de serviço para o mesmo empregador não pode superar:","a":["1 ano","2 anos","10 anos","4 anos"],"c":3,"e":"Art. 461, §1º, CLT: diferença de até 4 anos para o mesmo empregador e de até 2 anos na função, no mesmo estabelecimento."}],"neg":[{"q":"A Boa Folha compra um caderno por R$ 10 e vende por R$ 15. Qual o markup sobre o custo?","a":["50%","33%","150%","5%"],"c":0,"e":"Markup = (15 - 10) / 10 = 50% sobre o custo."},{"q":"Mesmo caderno: custo R$ 10, venda R$ 15. Qual a margem bruta sobre o preço de venda?","a":["50%","Cerca de 33,3%","66,7%","25%"],"c":1,"e":"Margem = lucro bruto / preço = 5 / 15 ≈ 33,3%."},{"q":"O financeiro pediu o fluxo de caixa. O que ele registra?","a":["O lucro contábil do ano","O valor do estoque parado no galpão","Entradas e saídas efetivas de dinheiro no período","Vendas faturadas, recebidas ou não"],"c":2,"e":"Fluxo de caixa acompanha o dinheiro que de fato entra e sai, não o lucro contábil."},{"q":"Na planilha do diretor, capital de giro (líquido) é calculado como:","a":["Ativo total menos patrimônio líquido","Receita menos custo das mercadorias","Lucro líquido somado à depreciação","Ativo circulante menos passivo circulante"],"c":3,"e":"Capital de giro líquido = ativo circulante - passivo circulante."},{"q":"Custo fixo mensal de R$ 30.000; mochila vendida a R$ 100 com custo variável de R$ 40. Quantas mochilas para empatar?","a":["500","300","750","1.000"],"c":0,"e":"Ponto de equilíbrio = 30.000 / (100 - 40) = 500 unidades."},{"q":"O consultor de terno brilhante falou em EBITDA. O que a sigla representa?","a":["Lucro após impostos e antes de dividendos","Lucro antes de juros, impostos, depreciação e amortização","Receita bruta menos devoluções e descontos","Caixa gerado depois dos investimentos"],"c":1,"e":"EBITDA = lucro antes de juros, impostos, depreciação e amortização."},{"q":"Qual destes é um custo variável para a distribuidora?","a":["O aluguel do galpão","O salário fixo do contador","O custo das resmas compradas para revender","O seguro anual do prédio"],"c":2,"e":"O custo da mercadoria revendida cresce ou cai conforme o volume vendido."},{"q":"A DRE, aquele relatório que ninguém lê até dar prejuízo, mostra:","a":["Bens e dívidas da empresa numa data","Somente as entradas de caixa do mês","A lista de fornecedores ativos","Receitas, custos, despesas e resultado de um período"],"c":3,"e":"A DRE apura o resultado (lucro ou prejuízo) de um período."},{"q":"O balanço patrimonial apresenta:","a":["Ativos, passivos e patrimônio líquido numa data","Receitas e despesas do mês","Entradas e saídas de caixa da semana","As metas trimestrais da diretoria"],"c":0,"e":"O balanço é uma foto da posição patrimonial numa data específica."},{"q":"Qual é a equação fundamental da contabilidade?","a":["Passivo = Ativo + Patrimônio Líquido","Ativo = Passivo + Patrimônio Líquido","Patrimônio Líquido = Ativo + Passivo","Ativo = Receita - Despesa"],"c":1,"e":"Tudo o que a empresa tem (ativo) é financiado por terceiros (passivo) ou sócios (PL)."},{"q":"CMV anual de R$ 1,2 milhão e estoque médio de R$ 200 mil. Qual o giro de estoque?","a":["4 vezes ao ano","12 vezes ao ano","6 vezes ao ano","2,4 vezes ao ano"],"c":2,"e":"Giro = CMV / estoque médio = 1.200.000 / 200.000 = 6."},{"q":"Se o estoque gira 6 vezes ao ano (ano comercial de 360 dias), quanto tempo em média a mercadoria fica parada?","a":["30 dias","90 dias","6 dias","60 dias"],"c":3,"e":"Prazo médio de estoque = 360 / 6 = 60 dias."},{"q":"Na curva ABC do estoque, os itens da classe A são:","a":["Poucos itens que concentram a maior parte do valor","Muitos itens de baixo valor unitário","Itens com validade vencida","Itens ordenados alfabeticamente"],"c":0,"e":"Classe A: poucos itens, grande peso no valor; exigem controle mais rigoroso."},{"q":"No método PEPS, qual mercadoria sai do estoque primeiro?","a":["A mais recente, que entrou por último","A mais antiga, que entrou primeiro","A de maior preço unitário","A que estiver mais perto da porta"],"c":1,"e":"PEPS = Primeiro que Entra, Primeiro que Sai."},{"q":"A volta às aulas é o Natal da Boa Folha. Quando reforçar o estoque de material escolar?","a":["Em março, depois que a procura passar","Só quando o estoque zerar","Antes do pico de janeiro e fevereiro","Sempre no mesmo mês, sem olhar dados"],"c":2,"e":"Na sazonalidade, o estoque deve estar pronto antes do pico de demanda."},{"q":"Faturamento de R$ 90.000 em 300 pedidos no mês. Qual o ticket médio?","a":["R$ 270","R$ 3.000","R$ 30","R$ 300"],"c":3,"e":"Ticket médio = 90.000 / 300 = R$ 300 por pedido."},{"q":"O marketing gastou R$ 20.000 (com vendas) e trouxe 50 clientes novos. Qual o CAC?","a":["R$ 400","R$ 250","R$ 4.000","R$ 40"],"c":0,"e":"CAC = investimento em aquisição / novos clientes = 20.000 / 50 = R$ 400."},{"q":"O que significa LTV (Lifetime Value)?","a":["Custo para conquistar um cliente novo","Valor total que o cliente gera ao longo do relacionamento","Lucro obtido apenas no último pedido","Prazo médio que o cliente leva para pagar"],"c":1,"e":"LTV estima quanto um cliente gera durante todo o tempo em que compra da empresa."},{"q":"Começamos o mês com 200 papelarias clientes e 10 deixaram de comprar. Qual o churn mensal?","a":["10%","2%","5%","20%"],"c":2,"e":"Churn = clientes perdidos / clientes no início = 10 / 200 = 5%."},{"q":"Qual relação entre LTV e CAC indica um negócio mais saudável?","a":["CAC maior que o LTV","LTV exatamente igual ao CAC","Não existe relação entre eles","LTV bem maior que o CAC"],"c":3,"e":"Se o cliente gera bem mais do que custou para conquistar, a aquisição se paga."},{"q":"No funil de vendas, o que costuma ficar no topo?","a":["Leads e contatos ainda pouco qualificados","Clientes que já fecharam contrato","Pedidos entregues e faturados","Apenas os clientes mais fiéis"],"c":0,"e":"O topo do funil é largo: muitos contatos, ainda sem qualificação."},{"q":"Dos 400 leads da feira de papelaria, 20 viraram clientes. Qual a taxa de conversão?","a":["20%","5%","2%","8%"],"c":1,"e":"Conversão = 20 / 400 = 5%."},{"q":"Numa negociação com fornecedor de papel, o que é a BATNA (ou MAANA)?","a":["O preço máximo que o fornecedor aceita","A cláusula de multa do contrato","Sua melhor alternativa caso não haja acordo","O desconto padrão da empresa"],"c":2,"e":"BATNA é o plano B: o que você faz se a negociação não fechar."},{"q":"Em negociação, o que é a ZOPA?","a":["O preço de abertura do vendedor","A multa por desistência do acordo","A pauta escrita da reunião","A faixa em que um acordo é aceitável para os dois lados"],"c":3,"e":"ZOPA = zona de possível acordo, onde os limites das partes se sobrepõem."},{"q":"O que é um KPI?","a":["Um indicador-chave de desempenho","Um plano de cargos e salários","Um imposto sobre produtos importados","Uma meta qualitativa sem número"],"c":0,"e":"KPI (Key Performance Indicator) mede o desempenho de algo que importa."},{"q":"Como se estrutura um OKR?","a":["Orçamento anual detalhado por conta","Objetivo qualitativo e resultados-chave mensuráveis","Lista de tarefas diárias da equipe","Um único indicador financeiro da empresa"],"c":1,"e":"OKR = Objective (aonde ir) + Key Results (como medir se chegou)."},{"q":"Mochila custa R$ 20. A diretoria quer margem de 20% sobre o preço de venda. Qual o preço?","a":["R$ 24","R$ 22","R$ 25","R$ 40"],"c":2,"e":"Preço = custo / (1 - margem) = 20 / 0,8 = R$ 25. R$ 24 seria markup de 20%."},{"q":"Carteira de R$ 500 mil a receber, com R$ 25 mil vencidos e não pagos. Qual a inadimplência?","a":["2,5%","20%","50%","5%"],"c":3,"e":"Inadimplência = 25.000 / 500.000 = 5%."},{"q":"O que indica o prazo médio de recebimento (PMR)?","a":["Dias, em média, para receber dos clientes","Dias, em média, para pagar fornecedores","Dias que o estoque fica parado","Dias até o pedido chegar ao cliente"],"c":0,"e":"PMR mede quanto tempo a empresa espera, em média, para receber suas vendas."},{"q":"Prazo médio de estoque 60 dias, de recebimento 30 e de pagamento 45. Qual o ciclo financeiro?","a":["135 dias","45 dias","15 dias","75 dias"],"c":1,"e":"Ciclo financeiro = PME + PMR - PMP = 60 + 30 - 45 = 45 dias."},{"q":"Qual atitude tende a melhorar o caixa da distribuidora?","a":["Dar mais prazo para os clientes pagarem","Comprar de uma vez o estoque do ano inteiro","Alongar o prazo com fornecedores sem custo extra","Pagar fornecedores antes, sem ganhar desconto"],"c":2,"e":"Pagar mais tarde sem custo mantém o dinheiro mais tempo no caixa."},{"q":"A Boa Folha vende 500 caixas de lápis para uma rede de papelarias. Que tipo de venda é essa?","a":["B2C","C2C","B2G","B2B"],"c":3,"e":"Empresa vendendo para empresa é B2B (business to business)."},{"q":"No site da Boa Folha, uma mãe compra uma mochila para o filho. Que tipo de venda é essa?","a":["B2C","B2B","B2G","C2B"],"c":0,"e":"Empresa vendendo ao consumidor final é B2C (business to consumer)."},{"q":"O que é o Simples Nacional?","a":["Imposto federal cobrado só sobre importados","Regime tributário simplificado para micro e pequenas empresas","Regime obrigatório para grandes empresas","Isenção total de impostos para o varejo"],"c":1,"e":"É um regime opcional que unifica tributos numa guia única para MEs e EPPs."},{"q":"Conceitualmente, o ICMS é um imposto:","a":["Municipal, sobre serviços em geral","Federal, sobre a renda das empresas","Estadual, sobre circulação de mercadorias e certos serviços","Federal, sobre a folha de salários"],"c":2,"e":"ICMS é estadual e incide sobre a circulação de mercadorias e alguns serviços."},{"q":"Que cláusula de contrato fixa a penalidade se uma parte não cumprir o combinado?","a":["Cláusula de foro","Cláusula de vigência","Cláusula de confidencialidade","Cláusula penal (multa)"],"c":3,"e":"A cláusula penal estabelece a multa por descumprimento."},{"q":"No contrato com a transportadora, o que define a cláusula de foro?","a":["Onde eventuais disputas judiciais serão julgadas","Por quanto tempo o contrato vale","O valor da multa por atraso","Quem paga o frete de devolução"],"c":0,"e":"Foro de eleição indica a comarca para resolver litígios do contrato."},{"q":"Em gestão de projetos, o que é o caminho crítico?","a":["As tarefas mais caras do projeto","Sequência de tarefas sem folga que define o prazo total","As tarefas feitas pelo gerente","A lista de riscos do projeto"],"c":1,"e":"Atrasar qualquer tarefa do caminho crítico atrasa o projeto inteiro."},{"q":"O clássico triângulo de restrições de um projeto envolve:","a":["Custo, lucro e imposto","Qualidade, vendas e estoque","Escopo, prazo e custo","Escopo, marketing e RH"],"c":2,"e":"Mexer em escopo, prazo ou custo afeta os outros dois (e a qualidade)."},{"q":"O que propõe a liderança situacional?","a":["Usar sempre o mesmo estilo com todos","Liderar apenas em momentos de crise","Delegar tudo desde o primeiro dia","Adaptar o estilo à maturidade do liderado"],"c":3,"e":"O líder ajusta direção e apoio conforme a competência e o engajamento da pessoa."},{"q":"Qual prática caracteriza um bom feedback?","a":["Específico, sobre comportamento e perto do fato","Genérico, para não constranger ninguém","Dado apenas na avaliação anual","Focado na personalidade da pessoa"],"c":0,"e":"Feedback útil é específico, oportuno e foca em comportamentos observáveis."},{"q":"Receita anual de R$ 1.000.000 e lucro líquido de R$ 80.000. Qual a margem líquida?","a":["80%","8%","12,5%","0,8%"],"c":1,"e":"Margem líquida = 80.000 / 1.000.000 = 8%."},{"q":"Qual a diferença entre margem bruta e margem líquida?","a":["A bruta já inclui o imposto sobre o lucro","As duas são sempre iguais","A líquida desconta também despesas, juros e impostos","A líquida ignora o custo da mercadoria"],"c":2,"e":"A bruta tira só o custo da mercadoria; a líquida tira todo o resto também."},{"q":"Qual característica define um custo fixo?","a":["Sobe na mesma proporção das vendas","Só existe em épocas de volta às aulas","É sempre menor que o custo variável","Não muda com o volume de vendas no curto prazo"],"c":3,"e":"Custo fixo (aluguel, por exemplo) se mantém mesmo se as vendas variarem."},{"q":"Estojo vendido a R$ 50 com custo variável de R$ 30. Qual a margem de contribuição unitária?","a":["R$ 20","R$ 80","R$ 30","R$ 1,67"],"c":0,"e":"Margem de contribuição = preço - custo variável = 50 - 30 = R$ 20."},{"q":"Vendemos 1.000 cadernos a R$ 12, custo variável R$ 7 cada e custo fixo de R$ 3.000. Qual o lucro?","a":["R$ 5.000","R$ 2.000","R$ 9.000","R$ 8.000"],"c":1,"e":"Lucro = 1.000 x (12 - 7) - 3.000 = 5.000 - 3.000 = R$ 2.000."},{"q":"Agenda de R$ 20 sai com 10% de desconto. Custo: R$ 15. Qual a margem bruta sobre o preço final?","a":["20%","25%","Cerca de 16,7%","15%"],"c":2,"e":"Preço final R$ 18; lucro R$ 3; margem = 3 / 18 ≈ 16,7%."},{"q":"As vendas bateram recorde, mas o caixa está no vermelho. Causa mais provável?","a":["Lucro alto demais no período","Queda do custo fixo","Clientes pagando tudo à vista","Vendas com prazo longo e estoque crescendo"],"c":3,"e":"Vender a prazo e encher o estoque consome caixa antes do dinheiro entrar."},{"q":"Lucro operacional (EBIT) de R$ 300 mil e depreciação e amortização de R$ 50 mil. Qual o EBITDA?","a":["R$ 350 mil","R$ 250 mil","R$ 300 mil","R$ 50 mil"],"c":0,"e":"EBITDA = EBIT + depreciação e amortização = 300 + 50 = R$ 350 mil."},{"q":"Na contabilidade, depreciação é:","a":["Desconto concedido a clientes fiéis","Perda de valor de bens, como a empilhadeira, com uso e tempo","Juros pagos em empréstimos","Queda no preço do papel no mercado"],"c":1,"e":"Depreciação reconhece o desgaste de ativos ao longo da vida útil."},{"q":"O que significa cross-docking na logística?","a":["Estocar mercadoria por longos períodos","Fazer entregas apenas por via marítima","Receber e expedir a carga quase sem armazenar","Devolver toda a mercadoria ao fornecedor"],"c":2,"e":"No cross-docking a carga passa pelo centro de distribuição e segue rápido."},{"q":"O fornecedor de mochilas diz que o lead time é de 20 dias. Isso significa:","a":["Prazo para pagar o boleto","Validade da proposta comercial","Tempo de garantia do produto","Tempo entre fazer o pedido e receber a mercadoria"],"c":3,"e":"Lead time é o tempo total do pedido até a entrega."},{"q":"Para que serve o estoque de segurança?","a":["Cobrir atrasos ou demanda acima do previsto","Guardar produtos com defeito","Esconder mercadoria do inventário","Substituir o seguro do galpão"],"c":0,"e":"É uma reserva que evita ruptura quando algo foge do planejado."},{"q":"O que é logística reversa?","a":["Entrega feita de ré pelo caminhão","Fluxo de retorno de produtos, devoluções e embalagens","Transporte do fornecedor até o cliente","Planejamento de rotas mais curtas"],"c":1,"e":"Logística reversa cuida do caminho de volta: devoluções, trocas e descarte."},{"q":"Metas SMART devem ser:","a":["Simples, modernas, ágeis, rápidas e técnicas","Secretas, mutáveis, amplas, rígidas e totais","Específicas, mensuráveis, atingíveis, relevantes e temporais","Sazonais, médias, anuais, reais e trimestrais"],"c":2,"e":"SMART: Specific, Measurable, Achievable, Relevant, Time-bound."},{"q":"Custo fixo de R$ 40.000 e margem de contribuição de 40% sobre as vendas. Qual a receita de equilíbrio?","a":["R$ 16.000","R$ 56.000","R$ 160.000","R$ 100.000"],"c":3,"e":"Receita de equilíbrio = 40.000 / 0,40 = R$ 100.000."},{"q":"Resma custa R$ 10 e é vendida a R$ 25. Qual o markup multiplicador?","a":["2,5","1,5","0,4","2,0"],"c":0,"e":"Markup multiplicador = preço / custo = 25 / 10 = 2,5."},{"q":"O estagiário confundiu faturamento com lucro. Faturamento é:","a":["O que sobra depois de pagar tudo","O total das vendas, antes de custos e despesas","O dinheiro guardado no cofre","O valor do patrimônio dos sócios"],"c":1,"e":"Faturamento (receita) é o total vendido; lucro é o que sobra após custos e despesas."},{"q":"O que sugere o princípio de Pareto (80/20)?","a":["Todo cliente tem o mesmo peso nas vendas","80% dos custos são sempre fixos","Poucas causas respondem pela maior parte dos efeitos","Só 20% dos funcionários devem ter meta"],"c":2,"e":"Em geral, uma minoria de itens ou clientes concentra a maior parte do resultado."},{"q":"Antecipar recebíveis no banco serve principalmente para:","a":["Reduzir o valor dos impostos devidos","Aumentar a margem bruta dos produtos","Acabar com a inadimplência sem nenhum custo","Transformar vendas a prazo em caixa agora, pagando taxa"],"c":3,"e":"A antecipação traz o dinheiro antes do vencimento, mas com desconto/juros."}],"esc":[{"q":"O Reginaldo do financeiro e a Sueli do comercial brigam aos gritos na copa pela última cápsula de café. Qual a melhor conduta do RH?","a":["Comprar só uma cápsula por dia para estimular a competitividade","Ouvir os dois em separado e depois mediar uma conversa conjunta","Postar no grupo da firma: 'Café é de todos, gente'","Esconder a cafeteira na sala da diretoria até a poeira baixar"],"c":1,"e":"Ouvir as partes em separado e depois mediar juntas resolve o conflito com imparcialidade, sem expor ninguém."},{"q":"O Gilmar, gerente de vendas, revisa cada vírgula dos e-mails da equipe e pede print de tela a cada hora. A equipe está desmotivada. O que o RH deve fazer?","a":["Instalar um software que tire print sozinho e poupe o Gilmar","Pedir à equipe que escreva sem vírgula, aí não tem o que revisar","Dar feedback ao Gilmar e apoiá-lo a delegar com metas claras","Fazer uma dinâmica de quebra-gelo com balões"],"c":2,"e":"Microgerenciamento se corrige com feedback ao gestor e desenvolvimento de delegação baseada em metas e confiança."},{"q":"A Patrícia conta ao RH que o supervisor Valdir comenta sobre o corpo dela e insiste em convites para sair. Qual a conduta correta?","a":["Acolher, registrar, garantir sigilo e abrir apuração formal","Dizer que o Valdir é assim mesmo, é o jeitão dele","Sugerir que ela use roupas mais discretas","Chamar os dois para uma acareação na copa, na frente de todos"],"c":0,"e":"Relato de assédio sexual exige acolhimento, sigilo, registro e apuração formal, protegendo a vítima de retaliação."},{"q":"A reunião semanal de compras dura 2 horas e só serve para cada um ler a própria planilha em voz alta. Como a liderança deve agir?","a":["Aumentar para 3 horas, para todos lerem com calma","Servir pão de queijo para a reunião ficar mais suportável","Proibir planilhas e passar a ler tudo de cabeça","Trocar por relatório assíncrono e reunir só para decidir"],"c":3,"e":"Reunião deve ter objetivo e pauta; atualizações de status funcionam melhor por escrito, poupando o tempo de todos."},{"q":"O Edson enviou ao cliente um e-mail em CAIXA ALTA, com 'conforme já falei 3 vezes!!!'. O cliente reclamou. Qual o melhor caminho?","a":["Mandar outro e-mail em caixa alta e negrito, para mostrar firmeza","Orientar o Edson sobre tom escrito e enviar retorno cordial ao cliente","Culpar o teclado, que travou no Caps Lock","Bloquear o e-mail do cliente para evitar novas reclamações"],"c":1,"e":"Feedback ao colaborador sobre comunicação escrita e reparo cordial com o cliente resolvem o problema e evitam repetição."},{"q":"Na apresentação à diretoria, a Rosana apresentou como dela o relatório que o estagiário Caio fez sozinho. O que a liderança deve fazer?","a":["Aplaudir a Rosana, afinal ela apresentou com muita confiança","Pedir que o Caio faça o próximo também, já que ficou bom","Reconhecer a autoria do Caio e conversar em particular com a Rosana","Criar um campeonato de quem apresenta melhor o trabalho alheio"],"c":2,"e":"Dar o crédito a quem fez é questão de justiça; a conversa reservada com a Rosana corrige a conduta sem humilhação."},{"q":"A impressora do 2º andar trava todo dia e virou motivo de bate-boca na fila. Qual a melhor atitude da liderança?","a":["Abrir chamado com a TI e combinar uma alternativa até o conserto","Dar um tapa na lateral, que funcionava com a TV da avó","Instituir senha de atendimento na fila da impressora","Pedir que todos imprimam em casa e tragam no dia seguinte"],"c":0,"e":"Problema de equipamento se resolve na causa: chamado técnico e solução provisória, em vez de deixar o conflito crescer."},{"q":"Corre o boato na copa de que a Márcia do faturamento vai ser demitida. Ela está abalada. O que o RH deve fazer?","a":["Entrar na roda da copa para descobrir mais detalhes","Confirmar o boato para ela 'se preparar emocionalmente'","Mandar e-mail geral: 'Ninguém vai ser demitido (por enquanto)'","Conversar com a Márcia, esclarecer o possível e coibir a fofoca"],"c":3,"e":"Fofoca se combate com comunicação transparente e acolhimento de quem foi exposto, sem alimentar o boato."},{"q":"O Wanderley, ótimo vendedor, estourou o prazo do relatório mensal pela terceira vez. Qual a melhor conduta do gestor?","a":["Dar feedback objetivo, entender a causa e combinar um plano com datas","Fingir que não viu, afinal ele vende muito","Mudar o prazo do relatório para 'quando der'","Passar o relatório para outra pessoa sem avisar ninguém"],"c":0,"e":"Feedback com fatos, investigação da causa e acordo de plano com prazos tratam o problema sem ignorar nem punir às cegas."},{"q":"Um cliente liga furioso porque o pedido de 500 cadernos chegou com 300. Qual a melhor conduta de quem atende?","a":["Dizer que 300 é mais da metade, então tá ótimo","Ouvir sem interromper, pedir desculpas, apurar e dar prazo de reposição","Transferir a ligação de ramal em ramal até cair","Explicar que o problema é do caminhoneiro, não da empresa"],"c":1,"e":"Escuta ativa, reconhecimento do erro e um compromisso concreto de solução recuperam a confiança do cliente."},{"q":"No home office, o Otávio some por horas e só responde 'tô em call'. A equipe está sobrecarregada. Como o gestor deve agir?","a":["Exigir câmera ligada 8 horas por dia, inclusive no almoço","Ligar para o Otávio de surpresa às 22h para testar","Conversar, alinhar entregas e horários de disponibilidade e acompanhar","Mudar o status dele no chat para 'ausente' de castigo"],"c":2,"e":"No remoto, o foco é combinar entregas e disponibilidade com clareza, não vigiar; a conversa direta resolve a causa."},{"q":"A Luciana, do RH, recebe e-mail do 'diretor' pedindo a planilha de salários com urgência, de um endereço gmail estranho. O que fazer?","a":["Mandar logo, diretor não gosta de esperar","Mandar só metade da planilha, por precaução","Responder pedindo uma selfie para provar que é o diretor","Não enviar, confirmar por outro canal e reportar à TI como phishing"],"c":3,"e":"Pedidos urgentes de dados sensíveis vindos de endereço suspeito são típicos de phishing: confirme por canal oficial e reporte."},{"q":"O Juvenal esqueceu na impressora a lista com CPF e salário de todo o setor, e ela circulou pela copa. Qual a conduta correta?","a":["Recolher as cópias, avisar o encarregado de dados e tratar o incidente","Usar a lista para negociar o próprio aumento","Fazer de conta que é a lista do amigo secreto","Colar a lista no mural, já que todo mundo já viu mesmo"],"c":0,"e":"Vazamento de dados pessoais é incidente sob a LGPD: conter, comunicar o encarregado (DPO) e tomar as medidas cabíveis."},{"q":"Na reunião, o gerente Dirceu chama a analista Tânia de 'burra' na frente da equipe, pela segunda vez. O que o RH deve fazer?","a":["Sugerir que a Tânia leve na esportiva","Acolher a Tânia, apurar e tratar formalmente a conduta do Dirceu","Dar ao Dirceu um livro de autoajuda de presente","Esperar a terceira vez para ter certeza"],"c":1,"e":"Humilhação pública e repetida pode configurar assédio moral; o RH deve acolher, apurar e aplicar medidas ao gestor."},{"q":"O Cláudio pergunta ao RH se pode chamar a nova colega trans pelo nome de registro, 'porque é o que está no documento'. Qual a orientação?","a":["Pode, documento é documento","Pode, mas só pelas costas","Usar o nome social dela, como a empresa faz nos registros internos","Melhor chamar só de 'colega' para não errar"],"c":2,"e":"Respeitar o nome social é básico de inclusão e dignidade; desrespeitá-lo pode configurar discriminação."},{"q":"A Fernanda chora no banheiro há dias e diz estar esgotada. O gestor percebe. Qual a melhor conduta?","a":["Dizer que todo mundo está cansado, faz parte","Mandar um meme motivacional no WhatsApp dela","Dar mais tarefas para ela ocupar a cabeça","Conversar em particular, rever a carga e indicar apoio profissional"],"c":3,"e":"Sinais de esgotamento pedem escuta reservada, ajuste da carga e encaminhamento a apoio psicológico ou ao programa da empresa."},{"q":"Usando comunicação não violenta, como o gestor deve abordar o Rubens, que chega 40 minutos atrasado toda segunda?","a":["'Notei atrasos de 40 min nas últimas 3 segundas. O que houve?'","'Você é um irresponsável e todo mundo comenta'","'Quero ver se segunda que vem você tem coragem de atrasar'","'Tudo bem, segunda é difícil para todo mundo, deixa pra lá'"],"c":0,"e":"A CNV parte da observação sem julgamento e abre espaço para entender necessidades, em vez de rotular ou ignorar."},{"q":"A coordenadora Ivone faz tudo sozinha porque 'ninguém faz direito' e está atolada. Qual o melhor conselho do RH?","a":["Fazer hora extra até o fim do ano, depois melhora","Delegar com instruções claras, prazos e acompanhamento","Pedir à TI um clone dela","Fazer tudo ainda mais rápido, cortando o almoço"],"c":1,"e":"Delegar bem, com contexto, prazo e acompanhamento, libera a líder e desenvolve a equipe; centralizar gera gargalo."},{"q":"O Severino manda áudio de 7 minutos no grupo do trabalho às 23h para avisar que a reunião mudou de sala. Qual a orientação?","a":["Responder com um áudio de 8 minutos, para ficar elas por elas","Sair do grupo em protesto à meia-noite","Avisos curtos, por escrito, no horário de trabalho e no canal certo","Acelerar o áudio em 2x e seguir a vida"],"c":2,"e":"Etiqueta digital: mensagens objetivas, por escrito, no canal adequado e respeitando o horário de descanso."},{"q":"A estagiária Bianca percebe que um colega deixa a senha do sistema num post-it colado no monitor. O que é o certo?","a":["Tirar foto do post-it, caso ela esqueça a própria senha","Colar um post-it ao lado com a senha dela também","Elogiar a organização do colega","Orientá-lo a tirar o post-it, trocar a senha e guardá-la com segurança"],"c":3,"e":"Senha exposta é falha de segurança; deve ser trocada e guardada de forma segura, nunca à vista."},{"q":"Dois candidatos empatam numa vaga. O gerente diz preferir o homem 'porque a outra pode engravidar'. Qual a conduta do RH?","a":["Barrar o critério, discriminatório e ilegal, e decidir por competência","Concordar, licença-maternidade dá trabalho","Perguntar à candidata se ela pretende ter filhos","Contratar os dois e ver quem desiste primeiro"],"c":0,"e":"Discriminar por gênero ou possível gravidez é ilegal; a seleção deve se basear em critérios objetivos de competência."},{"q":"Durante uma licitação, o fornecedor de papel oferece ao comprador Anselmo um fim de semana na praia 'de cortesia'. O que ele deve fazer?","a":["Aceitar, mas levar a família para dividir a culpa","Recusar, seguir o código de ética e informar o compliance","Aceitar e dar o contrato para retribuir a gentileza","Pedir um hotel melhor antes de decidir"],"c":1,"e":"Presentes de fornecedor durante negociação geram conflito de interesse; recuse e comunique conforme o código de ética."},{"q":"O analista Moacir pede feedback. Ele entrega no prazo, mas com muitos erros. Qual a melhor forma de dar esse feedback?","a":["'Tá ótimo, continue assim', para não desanimar","'Tá péssimo', e sair da sala","Citar fatos e exemplos, reconhecer o prazo e combinar como errar menos","Deixar um bilhete anônimo na mesa dele"],"c":2,"e":"Bom feedback é específico, baseado em fatos, equilibrado e termina com um plano de melhoria combinado."},{"q":"O líder Nestor tem 15 tarefas urgentes e não sabe por onde começar. Qual a melhor técnica de gestão do tempo?","a":["Começar pela mais divertida","Fazer todas ao mesmo tempo, em 15 abas","Esperar que algumas deixem de ser urgentes sozinhas","Priorizar por urgência e importância, delegar e agendar o resto"],"c":3,"e":"Classificar por urgência e importância (matriz de Eisenhower) ajuda a decidir o que fazer, delegar, agendar ou eliminar."},{"q":"Na festa de fim de ano, o Arnaldo bebe demais e passa a mão numa colega. No dia seguinte, ela procura o RH. O que fazer?","a":["Tratar como relato de assédio: acolher, registrar e apurar","Dizer que festa não conta, é fora do expediente","Proibir festas para sempre e encerrar o assunto","Pedir que ela releve, porque ele estava bêbado"],"c":0,"e":"Evento da empresa segue as regras de conduta; embriaguez não justifica assédio, que deve ser apurado formalmente."},{"q":"O Hélio vive fazendo piadas com o sotaque nordestino da colega Josefa. Ela diz que se sente humilhada. Qual a atitude certa?","a":["Explicar à Josefa que é só brincadeira","Dizer ao Hélio que a conduta é inaceitável e acompanhar o caso","Fazer piadas com o sotaque do Hélio para equilibrar","Sugerir à Josefa um curso para perder o sotaque"],"c":1,"e":"Piada que humilha por origem é discriminação; a liderança deve intervir, corrigir a conduta e acompanhar o caso."},{"q":"A gerente Solange quer contratar o sobrinho para uma vaga em que ela será a chefe direta. Qual a orientação do RH?","a":["Pode, família trabalha melhor junto","Pode, desde que ele a chame de 'senhora' no trabalho","Apontar o conflito de interesse e seguir a política de parentesco","Contratar o sobrinho e a tia dele também"],"c":2,"e":"Subordinação direta entre parentes gera conflito de interesse; a decisão deve seguir a política interna e um processo justo."},{"q":"O Teodoro fala por cima das colegas nas reuniões e repete as ideias delas como se fossem suas. Qual a melhor conduta do líder?","a":["Comprar um microfone maior para as colegas","Deixar rolar, ideia boa é ideia boa","Fazer reuniões só com o Teodoro, que fala mais","Garantir a vez de todas, dar crédito à autora e dar feedback a ele"],"c":3,"e":"O líder deve moderar a reunião com equidade, reconhecer a autoria das ideias e corrigir o comportamento em feedback."},{"q":"A equipe de logística pede home office, mas o trabalho exige estar no galpão. Qual a melhor resposta do gestor?","a":["Explicar por que não é viável e discutir outras flexibilidades","Liberar e mandar as caixas de papel por aplicativo para cada casa","Dizer que vai pensar e nunca mais tocar no assunto","Responder que home office é coisa de preguiçoso"],"c":0,"e":"Ser transparente sobre limites reais e buscar alternativas viáveis mantém a confiança e o engajamento da equipe."},{"q":"O vendedor Ronaldo prometeu ao cliente uma entrega impossível para fechar a venda. O cliente cobra. Qual a melhor conduta?","a":["Prometer uma entrega ainda mais rápida para compensar","Ser honesto, propor um prazo real e alinhar o processo com o Ronaldo","Mandar caixas vazias no prazo e o conteúdo depois","Dizer ao cliente que o Ronaldo não trabalha mais aqui"],"c":1,"e":"Transparência com o cliente e correção interna do processo evitam perder confiança e repetir promessas irreais."},{"q":"O Lourival mandou e-mail para 'todos' perguntando 'alguém viu meu grampeador?'. Já são 40 respostas. Qual a orientação?","a":["Responder a todos pedindo para pararem de responder a todos","Criar um grupo só para assuntos de grampeador","Orientar sobre 'responder a todos' e o uso do canal adequado","Comprar 40 grampeadores"],"c":2,"e":"E-mail para toda a empresa deve ser reservado a assuntos relevantes; usar o canal certo evita poluição e ruído."},{"q":"O novato Ismael chega e ninguém sabe onde ele senta, qual o login dele nem quem é o chefe. O que o RH deveria ter feito?","a":["Deixar ele se virar, assim aprende mais rápido","Dar uma cadeira e um 'boa sorte'","Enviar o organograma em PDF de 300 páginas","Onboarding planejado: mesa pronta, acessos, apresentações e padrinho"],"c":3,"e":"Integração estruturada acelera a adaptação, reduz erros e aumenta a retenção do novo colaborador."},{"q":"A Cleide, mãe solo, pede para sair às 17h para buscar o filho, compensando o horário. Qual a melhor resposta do gestor?","a":["Avaliar com abertura, combinar a compensação e formalizar o acordo","Negar, porque se abrir para um tem que abrir para todos","Aceitar, mas fazer cara feia toda vez que ela sair","Sugerir que o filho fique no escritório"],"c":0,"e":"Flexibilidade combinada e formalizada atende a necessidade da pessoa sem prejudicar as entregas, e retém talentos."},{"q":"Numa pesquisa de clima anônima, o gestor Josué pede ao RH para saber quem escreveu um comentário crítico. O que fazer?","a":["Revelar, ele é o gestor e tem direito","Preservar o anonimato e ajudar o gestor a trabalhar a crítica","Revelar só as iniciais","Fazer uma nova pesquisa 'anônima' com nome obrigatório"],"c":1,"e":"Quebrar o anonimato destrói a confiança na pesquisa e expõe a pessoa a retaliação; o foco deve ser no conteúdo."},{"q":"O Belmiro conta ao RH, em sigilo, que trata uma depressão. Dias depois, o gestor dele pergunta 'qual é a dele'. Qual a conduta?","a":["Contar tudo, o gestor precisa saber","Dizer que é 'coisa da cabeça' e encerrar o assunto","Manter sigilo e, com aval do Belmiro, combinar só os ajustes necessários","Dizer que ele está com preguiça"],"c":2,"e":"Informação de saúde é dado sensível e confidencial; só se compartilha o necessário e com consentimento do colaborador."},{"q":"O Aurélio recebe de um remetente desconhecido o link 'Veja as fotos da festa da firma'. O que ele deve fazer?","a":["Clicar, vai que ele saiu bem nas fotos","Repassar para o setor todo ver","Abrir no computador do colega, para não arriscar o dele","Não clicar e reportar à TI como possível golpe"],"c":3,"e":"Links de remetentes desconhecidos podem conter malware; a conduta segura é não abrir e reportar à TI."},{"q":"O chefe Osvaldo manda mensagens de trabalho no sábado e cobra resposta imediata. A equipe reclama. Qual a orientação do RH?","a":["Orientar o gestor a respeitar o descanso e agendar as mensagens","Pedir à equipe que diga que o celular caiu na piscina","Instituir plantão de resposta ao Osvaldo","Mandar mensagens ao Osvaldo no domingo, como vingança"],"c":0,"e":"Respeitar o direito à desconexão protege a saúde da equipe; urgências reais devem ter regras claras e combinadas."},{"q":"A Gisele, cadeirante, não consegue acessar a copa porque tem um degrau na entrada. O que a empresa deve fazer?","a":["Levar o café até ela, sempre que alguém lembrar","Instalar rampa e revisar a acessibilidade do escritório todo","Mudar a copa para o andar sem elevador","Colocar um aviso 'cuidado com o degrau'"],"c":1,"e":"Acessibilidade é obrigação legal e de inclusão: adaptar o espaço garante autonomia, sem depender de favores."},{"q":"O diretor quer demitir o Gervásio por mensagem de WhatsApp para 'evitar climão'. Qual a orientação do RH?","a":["Mandar, com um emoji triste para suavizar","Mandar um áudio com música de fundo","Desligar presencialmente, com respeito, clareza e privacidade","Trocar a senha dele e esperar ele perceber"],"c":2,"e":"Desligamento deve ser comunicado pessoalmente, com respeito e privacidade, explicando os próximos passos."},{"q":"O Adalberto bloqueou duas horas da agenda de todos com o título 'Alinhamento', sem pauta. Qual a melhor reação de um líder?","a":["Aceitar e levar o notebook para adiantar outras coisas","Recusar com um GIF de 'não'","Aparecer e ficar em silêncio, em protesto","Pedir objetivo e pauta e sugerir menos tempo ou um e-mail"],"c":3,"e":"Reunião produtiva tem objetivo, pauta e participantes certos; pedir isso com educação melhora a cultura da equipe."},{"q":"O analista Ulisses faz ótimo trabalho, mas nunca recebe elogios e parece desmotivado. Qual a melhor atitude da liderança?","a":["Reconhecer de forma específica e frequente as entregas dele","Elogiar só na avaliação anual, para ter mais impacto","Dizer que o salário já é o elogio","Dar a ele um troféu de 'funcionário do mês' feito de clipes"],"c":0,"e":"Reconhecimento específico e frequente reforça bons comportamentos e aumenta o engajamento."},{"q":"Dois gerentes disputam a única sala de reunião toda terça e ninguém cede. Qual a melhor conduta da gestão?","a":["Quem chegar primeiro leva, sem regras","Criar regras claras de reserva e mediar um acordo entre eles","Trancar a sala até eles se entenderem","Leiloar a sala em cápsulas de café"],"c":1,"e":"Conflito por recurso compartilhado se resolve com regras transparentes e mediação, não com disputa."},{"q":"A Mirela foi promovida e passou a liderar ex-colegas que eram amigos dela. Qual o melhor conselho do RH?","a":["Cortar a amizade com todos no primeiro dia","Continuar como antes e não cobrar ninguém","Alinhar expectativas com a equipe e ser justa com todos","Dar folga extra só para os amigos"],"c":2,"e":"Ao liderar ex-pares, conversar abertamente e manter critérios iguais para todos preserva relações e credibilidade."},{"q":"O técnico Jairo mandou a base de clientes para o próprio WhatsApp pessoal 'para trabalhar de casa'. O que a liderança deve fazer?","a":["Elogiar a dedicação dele","Pedir para ele mandar no seu WhatsApp também","Ignorar, é só uma planilha","Orientar a apagar, usar canais oficiais e tratar o incidente com a TI"],"c":3,"e":"Dados de clientes fora de ambientes autorizados violam a política de segurança e a LGPD; corrija e trate o incidente."},{"q":"Numa entrevista de seleção, o gestor pergunta à candidata qual a religião dela e se é casada. O que o RH deve fazer?","a":["Intervir e orientar a avaliar só competências ligadas à vaga","Anotar as respostas para desempate","Fazer a mesma pergunta a todos, para ser justo","Perguntar também o time de futebol"],"c":0,"e":"Perguntas sobre religião, estado civil e afins podem levar a discriminação; a entrevista deve focar na vaga."},{"q":"A equipe errou o pedido do maio /* ---------- componentes visuais ---------- */
function badgeArea(a) { return `<span class="badge" style="background:${Arte.CORES_AREA[a]}">${a}</span>`; }
function barra(v, max, cls) { let s = `<span class="stat ${cls}">${cls.toUpperCase() || 'H'} `; for (let i = 0; i < max; i++) s += `<i class="${i < v ? 'on' : ''}"></i>`; return s + ` ${v}</span>`; }
function statsHTML(m) { return barra(m.H, 10, '') + barra(m.S, 8, 's') + barra(m.R, 8, 'r'); }
function retratoEl(id, expr = 'neutro', esc = 2) { const cv = Arte.retratoCanvas(id, expr, esc); const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; c.className = 'px'; c.getContext('2d').drawImage(cv, 0, 0); return c; }
function bossEl(id, escala = 1) { const cv = Arte.bossCanvas(id, 0); const c = document.createElement('canvas'); c.width = 112; c.height = 120; c.className = 'px'; c.style.width = 112 * escala + 'px'; c.style.height = 120 * escala + 'px'; c.getContext('2d').drawImage(cv, 0, 0); return c; }
function clique(el, fn) { el.addEventListener('click', e => { Som.sfx('grampo'); fn(e); }); return el; }
function dicaStats() { return '<span class="sub">H = Hard skill · S = Soft skill · R = Resiliência (aguenta estresse)</span>'; }

/* ---------- UI: navegação ---------- */
const UI = {
  ui: null, timers: [],
  limpar() { this.ui.innerHTML = ''; FX.limpar(); this.timers.forEach(clearInterval); this.timers = []; },
  html(h) { this.ui.insertAdjacentHTML('beforeend', h); return this.ui.lastElementChild; },

  },
  engrenagem() { Opcoes.sincronizar(); },  // os botões de som ficam fixos no palco, em todas as telas
};

/* ---------- opções de áudio ---------- */
const Opcoes = {
  criarBotoes() {
    const box = document.createElement('div'); box.className = 'engr row'; box.style.gap = '6px';
    box.innerHTML = `<button class="btn peq azul" id="btnSom" title="Volume de música, efeitos e falas">♪ SOM</button><button class="btn peq" id="btnMudo" title="Liga/desliga todo o som (tecla M)">🔊</button>`;
    document.getElementById('stage').appendChild(box);
    clique($('#btnSom'), () => Opcoes.abrir());
    $('#btnMudo').addEventListener('click', () => Opcoes.alternarMudo());
    window.addEventListener('keydown', e => { if ((e.key === 'm' || e.key === 'M') && !e.ctrlKey && !e.metaKey) Opcoes.alternarMudo(); });
  },
  alternarMudo() { Som.init(); Som.setMuted(!Som.isMuted()); Prefs.save({ ...Som.getVol(), muted: Som.isMuted() }); this.sincronizar(); },
  sincronizar() { const b = $('#btnMudo'); if (b) { b.textContent = Som.isMuted() ? '🔇' : '🔊'; b.classList.toggle('verm', Som.isMuted()); } },
  aplicar() { const p = Prefs.load(); ['music', 'sfx', 'voice'].forEach(k => { if (typeof p[k] === 'number') Som.setVol(k, p[k]); }); Som.setMuted(!!p.muted); },
  abrir() {
    const p = { ...Som.getVol(), muted: Som.isMuted() };
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="painel" style="position:relative;width:420px"><div class="tit">Som</div>
      ${[['music', 'Música'], ['sfx', 'Efeitos'], ['voice', 'Falas (bla bla bla)']].map(([k, n]) => `<div class="row" style="margin:12px 0"><span style="width:170px">${n}</span><input type="range" min="0" max="1" step="0.05" value="${p[k]}" data-k="${k}" style="flex:1"></div>`).join('')}
      <div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn ${p.muted ? 'verm' : ''}" id="mudo">Mudo: ${p.muted ? 'sim' : 'não'}</button><button class="btn verde" id="fechar">Fechar</button></div>
      <div class="sub" style="margin-top:10px">${Estado.ok ? 'Salvamento automático ativo.' : 'Aviso: o navegador bloqueou o salvamento. O jogo funciona, mas o progresso não fica guardado.'}</div></div>`;
    document.getElementById('stage').appendChild(m);
    const salvar = () => Prefs.save({ ...Som.getVol(), muted: Som.isMuted() });
    m.querySelectorAll('input[type=range]').forEach(r => r.oninput = () => { Som.setVol(r.dataset.k, +r.value); salvar(); if (r.dataset.k === 'sfx') Som.sfx('grampo'); if (r.dataset.k === 'voice') Som.say('oi, tudo bem?', 'char'); });
    clique($('#mudo', m), e => { Som.setMuted(!Som.isMuted()); e.target.textContent = 'Mudo: ' + (Som.isMuted() ? 'sim' : 'não'); e.target.classList.toggle('verm', Som.isMuted()); salvar(); });
    clique($('#fechar', m), () => { m.remove(); Opcoes.sincronizar(); });
  },
};
